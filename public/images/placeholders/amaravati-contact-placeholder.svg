<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
    
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#051B38"/>
            <stop offset="50%" stop-color="#082B59"/>
            <stop offset="100%" stop-color="#0B3975"/>
        </linearGradient>
        <rect width="1600" height="900" fill="url(#bgGrad)"/>
        
    
    <defs>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <line x1="0" y1="0" x2="40" y2="0" stroke="rgba(38, 181, 216, 0.08)" stroke-width="1"/>
            <line x1="0" y1="0" x2="0" y2="40" stroke="rgba(38, 181, 216, 0.08)" stroke-width="1"/>
        </pattern>
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#DDA43A"/>
            <stop offset="100%" stop-color="#F59E0B"/>
        </linearGradient>
    </defs>
    <rect width="1600" height="900" fill="url(#grid)"/>
    
    <!-- Outer delicate border -->
    <rect x="6" y="6" width="1588" height="888" rx="10" fill="none" stroke="rgba(8, 43, 89, 0.15)" stroke-width="1.5" stroke-dasharray="8,6"/>
    
    
        <!-- Amaravati River & Stupa Arch Skyline -->
        <g transform="translate(660, 345)">
            <!-- Stupa outline & dome -->
            <path d="M 140 10 C 80 10 30 70 30 130 L 250 130 C 250 70 200 10 140 10 Z" fill="none" stroke="#26B5D8" stroke-width="3" stroke-dasharray="6,4"/>
            <circle cx="140" cy="8" r="8" fill="#DDA43A"/>
            <line x1="140" y1="0" x2="140" y2="25" stroke="#DDA43A" stroke-width="3"/>
            <!-- Krishna river wave -->
            <path d="M 0 140 Q 70 120 140 140 T 280 140" fill="none" stroke="#26B5D8" stroke-width="3"/>
            <path d="M 10 155 Q 80 135 150 155 T 290 155" fill="none" stroke="#DDA43A" stroke-width="2" opacity="0.7"/>
            <!-- Tech rays -->
            <line x1="60" y1="40" x2="40" y2="20" stroke="#26B5D8" stroke-width="2" opacity="0.6"/>
            <line x1="220" y1="40" x2="240" y2="20" stroke="#26B5D8" stroke-width="2" opacity="0.6"/>
            <line x1="140" y1="50" x2="140" y2="120" stroke="#26B5D8" stroke-width="1.5" stroke-dasharray="3,3"/>
        </g>
        

    <!-- Placeholder Badge -->
    <g transform="translate(800, 490)">
        <rect x="-140" y="-14" width="280" height="28" rx="14" fill="rgba(7, 139, 203, 0.2)" stroke="rgba(38, 181, 216, 0.4)" stroke-width="1.5"/>
        <text x="0" y="5" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#26B5D8">
            ASSET PLACEHOLDER • 1600x900
        </text>
    </g>

    <!-- Specific Target Label -->
    <text x="800" y="526" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#FAF8F2" letter-spacing="0.5">
        AMARAVATI CONTACT BACKGROUND — REPLACE LATER
    </text>

    <!-- Secondary Explanation -->
    <text x="800" y="548" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="500" fill="#EDF6FC">
        Amaravati Skyline & Krishna River Regional Connectivity
    </text>
</svg>