<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
    
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#EDF6FC"/>
            <stop offset="50%" stop-color="#FAF8F2"/>
            <stop offset="100%" stop-color="#E2EEF8"/>
        </linearGradient>
        <rect width="800" height="500" fill="url(#bgGrad)"/>
        
    
    <defs>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <line x1="0" y1="0" x2="40" y2="0" stroke="rgba(8, 43, 89, 0.05)" stroke-width="1"/>
            <line x1="0" y1="0" x2="0" y2="40" stroke="rgba(8, 43, 89, 0.05)" stroke-width="1"/>
        </pattern>
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#DDA43A"/>
            <stop offset="100%" stop-color="#F59E0B"/>
        </linearGradient>
    </defs>
    <rect width="800" height="500" fill="url(#grid)"/>
    
    <!-- Outer delicate border -->
    <rect x="6" y="6" width="788" height="488" rx="10" fill="none" stroke="rgba(8, 43, 89, 0.15)" stroke-width="1.5" stroke-dasharray="8,6"/>
    
    
        <g transform="translate(360, 175)">
            <!-- Rocket -->
            <path d="M 40 10 C 25 35 25 65 25 75 L 55 75 C 55 65 55 35 40 10 Z" fill="none" stroke="#0868B2" stroke-width="3"/>
            <circle cx="40" cy="40" r="7" fill="#DDA43A"/>
            <!-- Wings -->
            <path d="M 25 55 L 10 70 L 25 72 Z" fill="#0868B2"/>
            <path d="M 55 55 L 70 70 L 55 72 Z" fill="#0868B2"/>
            <!-- Flame -->
            <path d="M 33 75 Q 40 95 40 95 Q 47 75 47 75 Z" fill="#DDA43A"/>
        </g>
        

    <!-- Placeholder Badge -->
    <g transform="translate(400, 290)">
        <rect x="-140" y="-14" width="280" height="28" rx="14" fill="rgba(8, 104, 178, 0.08)" stroke="rgba(8, 104, 178, 0.25)" stroke-width="1.5"/>
        <text x="0" y="5" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#0868B2">
            ASSET PLACEHOLDER • 800x500
        </text>
    </g>

    <!-- Specific Target Label -->
    <text x="400" y="326" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#082B59" letter-spacing="0.5">
        Startup Solution Image
    </text>

    <!-- Secondary Explanation -->
    <text x="400" y="348" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="500" fill="#65748A">
        MVP Development, Rapid Prototyping & Scalable Arch
    </text>
</svg>