<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
    
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#EDF6FC"/>
            <stop offset="50%" stop-color="#FAF8F2"/>
            <stop offset="100%" stop-color="#E2EEF8"/>
        </linearGradient>
        <rect width="1200" height="800" fill="url(#bgGrad)"/>
        
    
    <defs>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <line x1="0" y1="0" x2="40" y2="0" stroke="rgba(8, 43, 89, 0.05)" stroke-width="1"/>
            <line x1="0" y1="0" x2="0" y2="40" stroke="rgba(8, 43, 89, 0.05)" stroke-width="1"/>
        </pattern>
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#DDA43A"/>
            <stop offset="100%" stop-color="#F59E0B"/>
        </linearGradient>
    </defs>
    <rect width="1200" height="800" fill="url(#grid)"/>
    
    <!-- Outer delicate border -->
    <rect x="6" y="6" width="1188" height="788" rx="10" fill="none" stroke="rgba(8, 43, 89, 0.15)" stroke-width="1.5" stroke-dasharray="8,6"/>
    
    
        <g transform="translate(530, 330)">
            <!-- Three Team Member Silhouettes -->
            <circle cx="40" cy="25" r="14" fill="none" stroke="#0868B2" stroke-width="2.5"/>
            <path d="M 22 65 C 22 45 32 42 40 42 C 48 42 58 45 58 65" fill="none" stroke="#0868B2" stroke-width="2.5"/>
            
            <circle cx="70" cy="20" r="16" fill="none" stroke="#DDA43A" stroke-width="3"/>
            <path d="M 50 65 C 50 40 60 38 70 38 C 80 38 90 40 90 65" fill="none" stroke="#DDA43A" stroke-width="3"/>
            
            <circle cx="100" cy="25" r="14" fill="none" stroke="#0868B2" stroke-width="2.5"/>
            <path d="M 82 65 C 82 45 92 42 100 42 C 108 42 118 45 118 65" fill="none" stroke="#0868B2" stroke-width="2.5"/>
        </g>
        

    <!-- Placeholder Badge -->
    <g transform="translate(600, 440)">
        <rect x="-140" y="-14" width="280" height="28" rx="14" fill="rgba(8, 104, 178, 0.08)" stroke="rgba(8, 104, 178, 0.25)" stroke-width="1.5"/>
        <text x="0" y="5" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#0868B2">
            ASSET PLACEHOLDER • 1200x800
        </text>
    </g>

    <!-- Specific Target Label -->
    <text x="600" y="476" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#082B59" letter-spacing="0.5">
        COMPANY / TEAM IMAGE — REPLACE LATER
    </text>

    <!-- Secondary Explanation -->
    <text x="600" y="498" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="500" fill="#65748A">
        Engineering Team & Collaborative Culture in Amaravati
    </text>
</svg>