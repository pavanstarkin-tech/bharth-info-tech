<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
    
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#EDF6FC"/>
            <stop offset="50%" stop-color="#FAF8F2"/>
            <stop offset="100%" stop-color="#E2EEF8"/>
        </linearGradient>
        <rect width="800" height="550" fill="url(#bgGrad)"/>
        
    
    <defs>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <line x1="0" y1="0" x2="40" y2="0" stroke="rgba(8, 43, 89, 0.05)" stroke-width="1"/>
            <line x1="0" y1="0" x2="0" y2="40" stroke="rgba(8, 43, 89, 0.05)" stroke-width="1"/>
        </pattern>
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#DDA43A"/>
            <stop offset="100%" stop-color="#F59E0B"/>
        </linearGradient>
    </defs>
    <rect width="800" height="550" fill="url(#grid)"/>
    
    <!-- Outer delicate border -->
    <rect x="6" y="6" width="788" height="538" rx="10" fill="none" stroke="rgba(8, 43, 89, 0.15)" stroke-width="1.5" stroke-dasharray="8,6"/>
    
    
        <g transform="translate(345, 200)">
            <!-- Server / Cloud nodes -->
            <rect x="10" y="0" width="90" height="25" rx="5" fill="none" stroke="#0868B2" stroke-width="3"/>
            <circle cx="25" cy="12" r="3" fill="#DDA43A"/>
            <circle cx="35" cy="12" r="3" fill="#0868B2"/>
            <line x1="75" y1="12" x2="85" y2="12" stroke="#0868B2" stroke-width="2"/>
            
            <rect x="10" y="38" width="90" height="25" rx="5" fill="none" stroke="#0868B2" stroke-width="3"/>
            <circle cx="25" cy="50" r="3" fill="#DDA43A"/>
            <circle cx="35" cy="50" r="3" fill="#0868B2"/>
            <line x1="75" y1="50" x2="85" y2="50" stroke="#0868B2" stroke-width="2"/>

            <rect x="10" y="76" width="90" height="25" rx="5" fill="none" stroke="#0868B2" stroke-width="3"/>
            <circle cx="25" cy="88" r="3" fill="#DDA43A"/>
            <circle cx="35" cy="88" r="3" fill="#0868B2"/>
            <line x1="75" y1="88" x2="85" y2="88" stroke="#0868B2" stroke-width="2"/>
            <!-- Connecting lines -->
            <line x1="55" y1="25" x2="55" y2="38" stroke="#DDA43A" stroke-width="2" stroke-dasharray="2,2"/>
            <line x1="55" y1="63" x2="55" y2="76" stroke="#DDA43A" stroke-width="2" stroke-dasharray="2,2"/>
        </g>
        

    <!-- Placeholder Badge -->
    <g transform="translate(400, 315)">
        <rect x="-140" y="-14" width="280" height="28" rx="14" fill="rgba(8, 104, 178, 0.08)" stroke="rgba(8, 104, 178, 0.25)" stroke-width="1.5"/>
        <text x="0" y="5" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#0868B2">
            ASSET PLACEHOLDER • 800x550
        </text>
    </g>

    <!-- Specific Target Label -->
    <text x="400" y="351" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#082B59" letter-spacing="0.5">
        Custom Software Image
    </text>

    <!-- Secondary Explanation -->
    <text x="400" y="373" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="500" fill="#65748A">
        Cloud Infrastructure, CRM Integrations & Automation
    </text>
</svg>